services:
  - type: web
    name: job-trackerv2
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: true
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
